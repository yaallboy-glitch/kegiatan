<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0c0c0e;--bg-soft:#0f0f12;--card:#16161a;--card2:#1c1c21;--border:#2a2a30;
  --gold:#facc15;--gold2:#f0c94a;--red2:#dc2626;--blue2:#1d4ed8;--gold-soft:#facc1533;--gold-dark:#a16207;--text:#f5f5f7;--text-dim:#a0a0aa;--text-dim2:#6b6b76;--red:#e11d48;--blue:#3b82f6;--green:#22c55e;
}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;margin:0;background:var(--bg);color:var(--text)}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

.layout{display:flex;min-height:100vh}
.sidebar{width:250px;flex:0 0 250px;background:var(--bg-soft);border-right:1px solid var(--border);border-top:3px solid;border-image:linear-gradient(90deg,var(--red),var(--blue),var(--gold)) 1;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;padding-bottom:20px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.brand .logo{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#0a0a0b;margin-bottom:10px;border:3px solid #0a0a0b;box-shadow:0 0 0 2px var(--gold),0 0 0 5px rgba(30,58,138,.45)}
.brand b{font-size:15px;letter-spacing:.4px}
.brand span{font-size:10.5px;color:var(--gold);letter-spacing:.6px;margin-top:2px}
.navlink{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:9px;color:var(--text-dim);font-size:14px;font-weight:500;cursor:pointer;margin-bottom:4px;border:0;background:transparent;width:100%;text-align:left}
.navlink svg{flex:0 0 18px;width:18px;height:18px}
.navlink:hover{background:var(--card2);color:var(--text)}
.navlink.active{background:linear-gradient(100deg,var(--red) 0%,var(--blue) 55%,var(--gold-dark) 100%);color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.navSpacer{flex:1}
.profileBox{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--card2);border:1px solid var(--border)}
.profileBox .avatar{width:34px;height:34px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 34px}
.profileBox .who{flex:1;min-width:0}
.profileBox .who b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profileBox .who small{color:var(--text-dim2);font-size:10.5px}
.logoutBtn{background:transparent;border:0;color:var(--text-dim2);cursor:pointer;padding:4px}
.logoutBtn:hover{color:var(--red)}

.main{flex:1;min-width:0;padding:26px 30px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border);position:relative}
.topbar::after{content:"";position:absolute;left:0;bottom:-1px;width:64px;height:3px;background:linear-gradient(90deg,var(--red),var(--blue),var(--gold));border-radius:3px}
.topbar h1{font-size:22px;margin:0}
.topbar h1 span{color:var(--gold)}
.topbar p{margin:4px 0 0;color:var(--text-dim);font-size:13.5px}

.card{background:var(--card);padding:16px 18px;border-radius:12px;margin:0 10px 10px 0;min-width:150px;border:1px solid var(--border)}
form.formCard{background:var(--card);border:1px solid var(--border);padding:16px;border-radius:12px;margin:0 0 16px}
input,select,textarea{padding:10px;margin:5px 0;width:100%;box-sizing:border-box;background:var(--bg-soft);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13.5px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
button.mainBtn{padding:10px 16px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#181205;border:0;border-radius:8px;cursor:pointer;margin-top:6px;font-weight:700;font-size:13.5px;box-shadow:0 4px 14px rgba(212,175,55,.28)}
button.secondary{background:linear-gradient(145deg,#22c55e,#16a34a);color:#0a1f10}
button.word{background:linear-gradient(145deg,var(--blue2),var(--blue));color:#fff;box-shadow:0 4px 14px rgba(29,78,216,.28)}
button:disabled{opacity:.5;cursor:not-allowed}
.pillBtn{border:1px solid var(--gold-dark);color:var(--gold);background:transparent;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.pillBtn.active,.pillBtn:hover{background:var(--gold);color:#181205;border-color:var(--gold)}
.pillGroup{display:flex;gap:8px}
.errBox{display:none;background:#3a1414;color:#fca5a5;border:1px solid #5c1f1f;padding:11px 12px;border-radius:8px;margin:10px 0;font-size:13px;white-space:pre-wrap;word-break:break-word}

.globalTopBar{display:flex;justify-content:flex-end;margin-bottom:10px}
.topProfileWrap{position:relative}
.topProfileBtn{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold-dark);background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;cursor:pointer;padding:0;background-size:cover;background-position:center;overflow:hidden}
.topProfileBtn:hover{border-color:var(--gold)}
.profileMenu{display:none;position:absolute;top:50px;right:0;background:var(--card);border:1px solid var(--border);border-radius:12px;min-width:224px;box-shadow:0 16px 40px rgba(0,0,0,.5);padding:8px;z-index:90}
.profileMenu.open{display:block}
.profileMenu .pmHead{display:flex;align-items:center;gap:10px;padding:8px 8px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.profileMenu .pmHead .pmAvatar{width:38px;height:38px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 38px;background-size:cover;background-position:center}
.profileMenu .pmHead .pmWho{min-width:0}
.profileMenu .pmHead b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.profileMenu .pmHead small{color:var(--text-dim2);font-size:11px}
.pmItem{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:8px;border:0;background:transparent;color:var(--text);font-size:13px;cursor:pointer;text-align:left;box-sizing:border-box}
.pmItem svg{flex:0 0 16px;width:16px;height:16px;color:var(--text-dim)}
.pmItem:hover{background:var(--card2)}
.pmItem.pmDanger{color:var(--red)}
.pmItem.pmDanger svg{color:var(--red)}
.pmSep{height:1px;background:var(--border);margin:6px 2px}

@media(max-width:1024px){
  .menuToggle{display:flex}
  .sidebar{position:fixed;top:0;left:-270px;height:100vh;transition:left .25s ease;z-index:50}
  .sidebar.open{left:0}
  .main{padding-top:66px}
}
@media(max-width:600px){
  .main{padding-left:14px;padding-right:14px;padding-bottom:30px}
  .topbar h1{font-size:19px}
  .topbar p{font-size:12.5px}
}

/* ---------- TRANSISI HALUS ANTAR HALAMAN ---------- */
body{animation:ktFadeIn .32s ease}
@keyframes ktFadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
body.kt-leaving{animation:none!important;opacity:0;transition:opacity .16s ease}
#dash:not([hidden]),#keu:not([hidden]),#spj:not([hidden]),#prop:not([hidden]),#log:not([hidden]){animation:ktPageIn .28s ease}
.page{animation:ktPageIn .28s ease}
@keyframes ktPageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

<div class="layout">

  <div class="sidebarOverlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img class="logo" src="https://raw.githubusercontent.com/yaallboy-glitch/kegiatan/refs/heads/main/IMG_6411.png" alt="Logo">
      <b>KARANG TARUNA</b>

    <a class="navlink" href="footage.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="15" height="12" rx="2"/><path d="M17 10l5-3v10l-5-3"/></svg>Footage</a>
    <a class="navlink" href="index.html#sosmed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>Sosial Media</a>

      <button class="logoutBtn" onclick="logout()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>

  <main class="main">

          <button class="pmItem" id="pmAdminBtn" style="display:none" onclick="goToAdminPanel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/><path d="M9 12l2 2 4-4"/></svg>Panel Admin</button>

        </div>

    <div class="topbar">
      <div><h1>Export <span>Laporan</span></h1><p>Pilih jenis export & isi detail, lalu unduh.</p></div>

<script>
// ======== API ========
const API = "https://kegiatan-api.newbrigademudasoropati.workers.dev";
let token = localStorage.getItem("token") || "";
if (!token) { location.href = "index.html"; }

const ROLE_LABEL_MAP = { admin:"Admin", bendahara:"Bendahara", pdd:"PDD", ketua:"Ketua", anggota:"Anggota" };
function roleLabel(role) { return ROLE_LABEL_MAP[role] || "Anggota"; }

let me = {};

// ===== FUNGSI API (PENTING) =====
async function api(path, opt={}) {
  let r;
  try {
    r = await fetch(API+path, { headers:{ "Content-Type":"application/json","Authorization":"Bearer "+token }, ...opt });
  } catch (netErr) {
    throw new Error("Tidak bisa menghubungi server (" + API + path + "). Cek koneksi.");
  }
  let d;
  try {
    d = await r.json();
  } catch {
    throw new Error("Server tidak mengembalikan JSON yang valid (status " + r.status + ").");
  }
  if (r.status === 401) { logout(); throw new Error("Sesi habis, silakan login lagi."); }
  if (!r.ok) throw new Error(d.error || ("Error " + r.status));
  return d;
}

// ===== URL PARAMS =====
const params = new URLSearchParams(location.search);
const exportType = params.get("jenis") || "keuangan"; // keuangan, lpj, proposal

const titles = { keuangan: "Laporan Keuangan", lpj: "LPJ (Laporan Pertanggungjawaban)", proposal: "Daftar Proposal" };
document.getElementById("exTitle").textContent = "Export " + (titles[exportType] || "Laporan");

// ===== PROFILE MENU =====
function toggleProfileMenu(e) { e.stopPropagation(); document.getElementById("profileMenu").classList.toggle("open"); }
document.addEventListener("click", function(e){ const wrap=document.getElementById("topProfileWrap"); const menu=document.getElementById("profileMenu"); if(wrap&&menu&&!wrap.contains(e.target)) menu.classList.remove("open"); });
function goToProfil(){ sessionStorage.setItem("ktOpenProfil","1"); location.href="index.html"; }
function goToAdminPanel(){ sessionStorage.setItem("ktOpenAdmin","1"); location.href="index.html"; }
function logout(){ localStorage.removeItem("token"); location.href="index.html"; }
function toggleSidebar(){ document.getElementById("sidebar").classList.toggle("open"); document.getElementById("sidebarOverlay").classList.toggle("open"); }

// ===== PROFILE DATA (ambil nama+role TERKINI dari server, bukan decode token) =====
function fotoKey(){ return "ktFotoProfil_"+ (me.username||"guest"); }
function applyFotoProfil(){
  const saved=localStorage.getItem(fotoKey()); const initial=(me.nama||"?").trim().charAt(0).toUpperCase();
  [document.getElementById("topProfileBtn"),document.getElementById("pmAvatarInit"),document.getElementById("avatarInit")].forEach(el=>{ if(!el)return; if(saved){el.style.backgroundImage=`url('${saved}')`;el.textContent="";}else{el.style.backgroundImage="";el.textContent=initial;} });
  const topInit=document.getElementById("topAvatarInit"); if(topInit) topInit.textContent=saved?"":initial;
}

// Ambil data /auth/me dengan percobaan ulang untuk error SEMENTARA. Token
// TIDAK ikut dihapus untuk error jenis ini — api() sudah memanggil logout()
// dari dalam saat server benar-benar membalas 401 (token tidak valid).
async function getMeWithRetry(maxRetries = 2) {
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    try {
      return await api("/auth/me");
    } catch (err) {
      if (attempt === maxRetries) throw err;
      await new Promise(res => setTimeout(res, 500 * (attempt + 1)));
    }
  }
}

async function initApp() {
  try {
    me = await getMeWithRetry();
  } catch (err) {
    showErr("initErr", (err.message || String(err)) + " Coba muat ulang halaman.");
    return;
  }

  document.getElementById("profName").textContent = me.nama;
  document.getElementById("profRole").textContent = roleLabel(me.role);
  document.getElementById("avatarInit").textContent = (me.nama||"?").trim().charAt(0).toUpperCase();
  document.getElementById("pmName").textContent = me.nama;
  document.getElementById("pmRole").textContent = roleLabel(me.role);
  document.getElementById("pmAdminBtn").style.display = (me.role === "admin" || me.role === "ketua") ? "" : "none";
  applyFotoProfil();
}
initApp();
const fotoProfilInput=document.getElementById("fotoProfilInput");
if(fotoProfilInput){ fotoProfilInput.addEventListener("change",function(e){ const file=e.target.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=function(ev){ const img=new Image(); img.onload=function(){ const size=240; const canvas=document.createElement("canvas"); canvas.width=size; canvas.height=size; const ctx=canvas.getContext("2d"); const scale=Math.max(size/img.width,size/img.height); const w=img.width*scale,h=img.height*scale; ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h); try{ localStorage.setItem(fotoKey(),canvas.toDataURL("image/jpeg",0.85)); applyFotoProfil(); }catch(err){alert("Gagal menyimpan foto");} }; img.src=ev.target.result; }; reader.readAsDataURL(file); e.target.value=""; }); }

// ===== HELPER =====
function showErr(boxId, msg) { const b=document.getElementById(boxId); b.innerHTML=msg; b.style.display="block"; }
function clearErr(boxId) { const b=document.getElementById(boxId); b.style.display="none"; b.textContent=""; }
const rp = n => "Rp " + Number(n||0).toLocaleString("id-ID");

// ===== FORMAT =====
let currentFormat = "pdf";
function setFormat(fmt){
  currentFormat = fmt;
  document.querySelectorAll("#exFormatGroup .pillBtn").forEach(b=>b.classList.toggle("active",b.dataset.fmt===fmt));
}

// ===== GENERATE =====
async function generateExport(){
  clearErr("exErr");
  const start = document.getElementById("exPeriodeStart").value;
  const end = document.getElementById("exPeriodeEnd").value;
  const kegiatan = (document.getElementById("exKegiatan").value || "-").trim();
  const ketua = (document.getElementById("exKetua").value || "").trim();
  const bendahara = (document.getElementById("exBendahara").value || "").trim();
  const params = { start, end, kegiatan, ketuaNama:ketua, bendaharaNama:bendahara };
  const btn = document.querySelector("button.mainBtn");
  const oldText = btn.textContent; btn.textContent="Memproses..."; btn.disabled=true;
  try {
    let fn = null;
    if (exportType === "keuangan") {
      if (currentFormat === "pdf") fn = exportKeuanganPDF;
      else if (currentFormat === "excel") fn = exportKeuanganExcel;
      else fn = exportKeuanganWord;
    } else if (exportType === "lpj") {
      if (currentFormat === "pdf") fn = exportLPJPDF;
      else if (currentFormat === "excel") fn = exportLPJExcel;
      else fn = exportLPJWord;
    } else if (exportType === "proposal") {
      if (currentFormat === "pdf") fn = exportProposalPDF;
      else if (currentFormat === "excel") fn = exportProposalExcel;
      else fn = exportProposalWord;
    }
    if (!fn) throw new Error("Jenis export tidak valid");
    await fn(params);
  } catch(err) {
    showErr("exErr", err.message || String(err));
  } finally {
    btn.innerHTML = oldText; btn.disabled = false;
  }
}

// ===================================================================
// ===== SEMUA FUNGSI EXPORT (LENGKAP: PDF, EXCEL, WORD) =====
// ===================================================================

async function loadImageAsDataURL(url){
  const res = await fetch(url);
  const blob = await res.blob();
  return new Promise((resolve,reject)=>{ const reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=reject; reader.readAsDataURL(blob); });
}

// ---- Helper PDF Baru ----
function pdfFooter(doc, orgLine){
  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    doc.setDrawColor(200,200,200);
    doc.setLineWidth(0.2);
    doc.line(14,280,196,280);
    doc.setFontSize(8);
    doc.setTextColor(120,120,120);
    doc.text(orgLine, 14, 285);
    doc.text("Halaman " + i + " dari " + pageCount, 105, 285, { align: "center" });
  }
}

function fmtTgl(iso){
  try{ const [y,m,d]=String(iso).split("-"); return d+"/"+m+"/"+y; }catch{ return iso; }
}

function fmtIndoPeriode(start,end){
  const bulan=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  try{
    const s=new Date(start+"T00:00:00");
    const e=new Date(end+"T00:00:00");
    if(s.getMonth()===e.getMonth()&&s.getFullYear()===e.getFullYear()) return bulan[s.getMonth()]+" "+s.getFullYear();
    return fmtTgl(start)+" s/d "+fmtTgl(end);
  }catch{ return start+" s/d "+end; }
}

function pdfAutoTable(doc, head, body, startY, columnStyles = {}){
  const margin = { left: 14, right: 14, top: 20, bottom: 22 };
  const common = {
    startY,
    margin,
    head,
    body,
    styles: { fontSize: 9, cellPadding: 3, textColor: [23,23,23] },
    headStyles: { fillColor: [243,244,246], textColor: [23,23,23], fontStyle: "bold" },
    alternateRowStyles: { fillColor: [250,250,250] },

// Semua helper Excel/Word
const XC = { DARK:'FF171717', RED:'FFC00000', LIGHT:'FFF3F4F6', BORDER:'FFD1D5DB', ZEBRA:'FFFAFAFA', WHITE:'FFFFFFFF', GOLD:'FFD9A406', CREAM:'FFFDF6E3' };
const RP_FMT = '"Rp" #,##0';

function xMergeStyle(ws, r1, c1, r2, c2, opt = {}) {
  if (r1 !== r2 || c1 !== c2) ws.mergeCells(r1, c1, r2, c2);
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) { const cell = ws.getCell(r, c); if (opt.fill) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: opt.fill } }; if (opt.font) cell.font = opt.font; if (opt.align) cell.alignment = opt.align; }
  const top = ws.getCell(r1, c1); if (opt.value !== undefined) top.value = opt.value; if (opt.numFmt) top.numFmt = opt.numFmt;
}
function xTitleBlock(ws, title, subtitle, colCount) {
  ws.mergeCells(1, 1, 2, colCount); const t = ws.getCell(1, 1); t.value = title; t.font = { size: 20, bold: true, color: { argb: XC.WHITE } }; t.alignment = { horizontal: 'center', vertical: 'middle' }; for (let r = 1; r <= 2; r++) for (let c = 1; c <= colCount; c++) ws.getCell(r, c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XC.DARK } }; ws.getRow(1).height = 26; ws.getRow(2).height = 26;
  ws.mergeCells(3, 1, 3, colCount); const s = ws.getCell(3, 1); s.value = subtitle; s.font = { size: 10, color: { argb: 'FF666666' } }; s.alignment = { horizontal: 'center' };
}
function xReportHeader(ws, entitas, subtitle, colCount) {
  ws.getRow(1).height = 24; ws.getRow(2).height = 16; const t = ws.getCell(1, 1); ws.mergeCells(1, 1, 1, colCount); t.value = entitas.toUpperCase(); t.font = { size: 17, bold: true, color: { argb: XC.DARK } }; t.alignment = { horizontal: 'left', vertical: 'middle', indent: 2 };
  const s = ws.getCell(2, 1); ws.mergeCells(2, 1, 2, colCount); s.value = subtitle; s.font = { size: 10.5, bold: true, color: { argb: XC.GOLD } }; s.alignment = { horizontal: 'left', vertical: 'middle', indent: 2 };
  ws.getRow(3).height = 4; for (let c = 1; c <= colCount; c++) ws.getCell(3, c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XC.GOLD } };
}
function xInfoBox(ws, row, colCount, pairs) {
  ws.getRow(row).height = 20; for (let c = 1; c <= colCount; c++) { const cell = ws.getCell(row, c); cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XC.CREAM } }; if (c === 1) cell.border = { left: { style: 'thick', color: { argb: XC.RED } } }; }
  const half = Math.ceil(colCount / 2); if (pairs[0]) { ws.mergeCells(row, 1, row, half); const c1 = ws.getCell(row, 1); c1.value = pairs[0][0] + ": " + pairs[0][1]; c1.font = { bold: true, size: 10, color: { argb: XC.DARK } }; c1.alignment = { horizontal: 'left', vertical: 'middle', indent: 1 }; }
  if (pairs[1]) { ws.mergeCells(row, half + 1, row, colCount); const c2 = ws.getCell(row, half + 1); c2.value = pairs[1][0] + ": " + pairs[1][1]; c2.font = { bold: true, size: 10, color: { argb: XC.DARK } }; c2.alignment = { horizontal: 'left', vertical: 'middle', indent: 1 }; }
}
function xHeaderRow(ws, rowIdx, labels) { labels.forEach((lab, i) => { const c = ws.getCell(rowIdx, i + 1); c.value = lab; c.font = { bold: true, color: { argb: XC.WHITE } }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XC.DARK } }; c.alignment = { horizontal: 'center', vertical: 'middle' }; }); ws.getRow(rowIdx).height = 20; }
function xZebraBorder(ws, rowIdx, colCount, zebra) { for (let c = 1; c <= colCount; c++) { const cell = ws.getCell(rowIdx, c); cell.border = { top: { style: 'thin', color: { argb: XC.BORDER } }, left: { style: 'thin', color: { argb: XC.BORDER } }, bottom: { style: 'thin', color: { argb: XC.BORDER } }, right: { style: 'thin', color: { argb: XC.BORDER } } }; if (zebra) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XC.ZEBRA } }; } }
function xSaveBlob(blob, filename) { const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }

  xReportHeader(ws, entitas, "LAPORAN PERTANGGUNGJAWABAN (LPJ) — " + periodeLabel, colCount);
  await xEmbedLogo(wb, ws);

  const infoRow = 4;
  xInfoBox(ws, infoRow, colCount, [["Kegiatan", kegiatan || "-"], ["Status", status]]);
  const infoRow2 = 5;
  xInfoBox(ws, infoRow2, colCount, [["Ketua", ketuaNama || "-"], ["Bendahara", bendaharaNama || "-"]]);

  function buildSection(title, list, startRow) {
    let r = startRow;
    ws.mergeCells(r, 1, r, colCount);
    const t = ws.getCell(r, 1); t.value = title; t.font = { bold: true, size: 11, color: { argb: XC.WHITE } };
    t.fill = { type: "pattern", pattern: "solid", fgColor: { argb: XC.RED } };
    t.alignment = { horizontal: "left", vertical: "middle" }; ws.getRow(r).height = 18;
    r += 1;
    const hdrRow = r;
    xHeaderRow(ws, hdrRow, ["No", "Tanggal", "Keterangan", "Jumlah"]);
    const firstDataRow = hdrRow + 1;
    const totalRows = list.length + EXTRA_ROWS;
    const lastDataRow = hdrRow + totalRows;
    for (let i = 0; i < totalRows; i++) {
      const item = list[i];
      const rowIdx = firstDataRow + i;
      const row = ws.getRow(rowIdx);
      row.getCell(1).value = i + 1;
      if (item) { row.getCell(2).value = item.tanggal; row.getCell(3).value = item.keterangan; row.getCell(4).value = item.jumlah; }
      row.getCell(4).numFmt = RP_FMT;
      row.getCell(1).alignment = { horizontal: "center" };
      xZebraBorder(ws, rowIdx, colCount, i % 2 === 1);
    }
    const totalRow = lastDataRow + 1;
    xMergeStyle(ws, totalRow, 1, totalRow, 3, { value: "TOTAL " + title.toUpperCase(), fill: XC.RED, font: { bold: true, size: 10, color: { argb: XC.WHITE } }, align: { horizontal: "left", vertical: "middle" } });
    xMergeStyle(ws, totalRow, 4, totalRow, 4, { value: { formula: `SUM(D${firstDataRow}:D${lastDataRow})` }, fill: XC.LIGHT, font: { bold: true, size: 11 }, align: { horizontal: "center", vertical: "middle" }, numFmt: RP_FMT });
    return { nextRow: totalRow + 2, totalCellRef: `D${totalRow}` };
  }

  const secMasuk = buildSection("Rincian Uang Masuk (Penerimaan)", masukRows, 7);
  const secKeluar = buildSection("Rincian Uang Keluar (Pengeluaran)", keluarRows, secMasuk.nextRow);

  xMergeStyle(ws, saldoRow, 1, saldoRow, 3, { value: "SISA SALDO / DANA " + entitas.toUpperCase(), fill: XC.DARK, font: { bold: true, size: 10, color: { argb: XC.WHITE } }, align: { horizontal: "left", vertical: "middle" } });

  const sigRow = saldoRow + 3;

  ws.getCell(sigRow, 3).value = "BENDAHARA KEUANGAN";
  [ws.getCell(sigRow, 1), ws.getCell(sigRow, 3)].forEach(c => { c.font = { bold: true, size: 9 }; c.alignment = { horizontal: "center" }; });
  const sigNameRow = sigRow + 3;
  ws.mergeCells(sigNameRow, 1, sigNameRow, 2); ws.mergeCells(sigNameRow, 3, sigNameRow, 4);
  ws.getCell(sigNameRow, 1).value = ketuaNama || "________________________";
  ws.getCell(sigNameRow, 3).value = bendaharaNama || "________________________";
  [ws.getCell(sigNameRow, 1), ws.getCell(sigNameRow, 3)].forEach(c => { c.font = { bold: true, size: 10, color: { argb: XC.RED } }; c.alignment = { horizontal: "center" }; });

  const noteRow = sigNameRow + 3;
  ws.mergeCells(noteRow, 1, noteRow, 4);
  ws.getCell(noteRow, 1).value = "Catatan: baris kosong di bawah data sudah berisi rumus Total otomatis — tinggal isi Tanggal/Keterangan/Jumlah untuk melanjutkan pencatatan secara manual.";
  ws.getCell(noteRow, 1).font = { italic: true, size: 9, color: { argb: "FF6B7280" } };

  const buffer = await wb.xlsx.writeBuffer();
  xSaveBlob(new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), "LPJ_" + (start || "semua") + "_" + (end || "data") + ".xlsx");
}
