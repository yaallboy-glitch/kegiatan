<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debug Koneksi Drive</title>
<style>
:root{
  --bg:#0a0a0b;--bg-soft:#0d0d0f;--card:#161618;--card2:#1b1b1e;--border:#2a2a2e;
  --gold:#e0ac2b;--text:#f4f4f5;--text-dim:#9ca0a8;
}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;margin:0;background:var(--bg);color:var(--text);padding:20px}
h1{font-size:18px;margin:0 0 4px}
p{color:var(--text-dim);font-size:13px;margin:0 0 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
button{padding:12px 18px;background:linear-gradient(145deg,#f0c14b,#c9932a);color:#181205;border:0;border-radius:9px;font-weight:700;cursor:pointer;font-size:14px}
button:disabled{opacity:.5}
button.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
pre{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12px;white-space:pre-wrap;word-break:break-word;color:#d7d7db;min-height:60px}
.err{background:#3a1414;color:#fca5a5;border:1px solid #5c1f1f;padding:11px 12px;border-radius:8px;margin-bottom:14px;font-size:13px;display:none}
</style>
</head>
<body>

<h1>🔍 Debug Koneksi Google Drive</h1>
<p>Halaman sementara untuk cek kenapa Sync Drive tidak menemukan file. Boleh dihapus setelah masalah selesai.</p>

<div id="err" class="err"></div>

<div class="row">
  <button onclick="cekDebug('footage')">Cek Folder Footage</button>
  <button onclick="cekDebug('file')">Cek Folder File</button>
  <button class="secondary" onclick="location.href='footage.html'">← Kembali ke App</button>
</div>

<pre id="hasil">Belum ada hasil. Tap salah satu tombol di atas.</pre>

<script>
const API = "https://kegiatan-api.newbrigademudasoropati.workers.dev";
const token = localStorage.getItem("token") || "";

if (!token) {
  document.getElementById("hasil").textContent = "Anda belum login. Buka index.html dulu dan login, baru kembali ke halaman ini.";
}

function showErr(msg) {
  const b = document.getElementById("err");
  b.textContent = "⚠️ " + msg;
  b.style.display = "block";
}

async function cekDebug(which) {
  document.getElementById("err").style.display = "none";
  document.getElementById("hasil").textContent = "Memuat...";
  try {
    const r = await fetch(API + "/drive/debug?which=" + which, {
      headers: { Authorization: "Bearer " + token }
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ("Error " + r.status));
    document.getElementById("hasil").textContent = JSON.stringify(d, null, 2);
  } catch (err) {
    showErr(err.message);
    document.getElementById("hasil").textContent = "Gagal memuat hasil debug.";
  }
}
</script>
</body>
</html>
