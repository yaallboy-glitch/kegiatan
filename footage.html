<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karang Taruna | Footage</title>
<style>
:root{
  --bg:#0c0c0e;
  --bg-soft:#0f0f12;
  --card:#16161a;
  --card2:#1c1c21;
  --border:#2a2a30;
  --gold:#facc15;
  --gold-soft:#facc1533;
  --gold-dark:#a16207;
  --text:#f5f5f7;
  --text-dim:#a0a0aa;
  --text-dim2:#6b6b76;
  --red:#ef4444;
  --blue:#3b82f6;
}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;margin:0;background:var(--bg);color:var(--text)}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

.layout{display:flex;min-height:100vh}
.sidebar{width:250px;flex:0 0 250px;background:var(--bg-soft);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;padding-bottom:20px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.brand .logo{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#0a0a0b;margin-bottom:10px;border:3px solid #0a0a0b;box-shadow:0 0 0 2px var(--gold)}
.brand b{font-size:15px;letter-spacing:.4px}
.brand span{font-size:10.5px;color:var(--gold);letter-spacing:.6px;margin-top:2px}
.navlink{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:9px;color:var(--text-dim);font-size:14px;font-weight:500;cursor:pointer;margin-bottom:4px;border:0;background:transparent;width:100%;text-align:left}
.navlink svg{flex:0 0 18px;width:18px;height:18px}
.navlink:hover{background:var(--card2);color:var(--text)}
.navlink.active{background:linear-gradient(90deg,#facc15,#eab308);color:#181205;font-weight:700}
.navSpacer{flex:1}
.profileBox{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--card2);border:1px solid var(--border)}
.profileBox .avatar{width:34px;height:34px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 34px}
.profileBox .who{flex:1;min-width:0}
.profileBox .who b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profileBox .who small{color:var(--text-dim2);font-size:10.5px}
.logoutBtn{background:transparent;border:0;color:var(--text-dim2);cursor:pointer;padding:4px}
.logoutBtn:hover{color:#ef4444}

.main{flex:1;min-width:0;padding:26px 30px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.topbar h1{font-size:22px;margin:0}
.topbar h1 span{color:var(--gold)}
.topbar p{margin:4px 0 0;color:var(--text-dim);font-size:13.5px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.searchBox{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:9px 12px}
.searchBox input{background:transparent;border:0;outline:0;color:var(--text);font-size:13.5px;width:100%}
.searchBox svg{color:var(--text-dim2);flex:0 0 auto}
.pillGroup{display:flex;gap:8px}
.pillBtn{border:1px solid var(--gold-dark);color:var(--gold);background:transparent;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.pillBtn.active,.pillBtn:hover{background:var(--gold);color:#181205}

.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.footGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.footItem{position:relative}
.footItem .thumb{aspect-ratio:1/1;border-radius:12px;background:linear-gradient(150deg,#2a2413,#3a2f14);display:flex;align-items:center;justify-content:center;color:var(--gold-dark);margin-bottom:7px;position:relative}
.footItem b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.footItem small{color:var(--text-dim2);font-size:11.5px}
.starBadge{position:absolute;top:6px;right:6px;font-size:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.itemActions{display:flex;gap:8px;margin-top:5px;font-size:14px}
.itemActions span{cursor:pointer;color:var(--text-dim2)}
.itemActions span:hover{color:var(--gold)}
.itemActions span.danger:hover{color:#ef4444}

.itemMenuWrap{position:relative;margin-top:5px}
.dotsBtn{background:var(--card2);border:1px solid var(--border);color:var(--text-dim);width:26px;height:22px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1}
.dotsBtn:hover{color:var(--gold);border-color:var(--gold-dark)}
.dropdownMenu{display:none;position:absolute;left:0;top:26px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:150px;z-index:20;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.dropdownMenu.open{display:block}
.dropdownMenu div{padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.dropdownMenu div:hover{background:var(--card)}
.dropdownMenu div.danger{color:#ef4444}

.selectCheck{position:absolute;top:6px;left:6px;width:19px;height:19px;z-index:6;cursor:pointer;accent-color:var(--gold)}

#bulkBar{display:none;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--gold-dark);border-radius:10px;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap}

.folderToolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.folderDropdownWrap{position:relative}
#folderDropdownBtn{display:inline-flex;align-items:center;gap:6px;max-width:230px}
#folderDropdownLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;display:inline-block;vertical-align:middle}
.ddArrow{font-size:10px;opacity:.7}
.folderDropdownPanel{display:none;position:absolute;left:0;top:calc(100% + 6px);background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:8px;min-width:250px;max-width:min(340px,80vw);z-index:30;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.folderDropdownPanel.open{display:block}
.folderDropdownList{max-height:280px;overflow-y:auto}
.folderRow{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:8px}
.folderRow:hover{background:var(--card)}
.folderCheck{cursor:pointer;font-size:16px;flex:0 0 auto;user-select:none;line-height:1}
.folderRowName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;cursor:pointer}
.folderRowName:hover{color:var(--gold)}
.folderRow.active .folderRowName{color:var(--gold);font-weight:700}
.folderBulkBar{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;margin-bottom:6px;border-bottom:1px solid var(--border);font-size:12.5px}
.folderAddRow{width:100%;margin-top:6px;padding:8px;background:transparent;border:1px dashed var(--gold-dark);color:var(--gold);border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer}
.folderAddRow:hover{background:var(--gold);color:#181205;border-style:solid}

.modalOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;align-items:center;justify-content:center}
.modalOverlay.open{display:flex}
.modalBox{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;width:290px}
.modalBox h3{margin:0 0 12px;font-size:15px}
.modalBox select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px;margin-bottom:14px;font-size:13.5px}
.modalActions{display:flex;gap:8px;justify-content:flex-end}

/* ===== Preview foto/video (mirip lightbox Claude, tidak full-screen) ===== */
.previewOverlay{display:none;position:fixed;inset:0;background:rgba(6,4,3,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:90;align-items:center;justify-content:center;padding:32px}
.previewOverlay.open{display:flex;animation:pvFade .16s ease}
.previewBox{position:relative;width:fit-content;max-width:min(620px,88vw);max-height:86vh;background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 24px 60px rgba(0,0,0,.55);animation:pvPop .32s cubic-bezier(.22,.9,.3,1.18)}
.previewBox::before{content:"";position:absolute;inset:0;border-radius:16px;padding:2px;background:linear-gradient(135deg,#d8483c,#e0ac2b 45%,#d8483c);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;animation:pvGlow 2.6s ease-in-out infinite}
@keyframes pvFade{from{opacity:0}to{opacity:1}}
@keyframes pvPop{from{opacity:0;transform:scale(.93) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes pvGlow{0%,100%{opacity:.55;filter:brightness(1)}50%{opacity:1;filter:brightness(1.25)}}
.previewMedia{display:flex;align-items:center;justify-content:center;min-width:200px;min-height:140px;max-width:calc(88vw - 24px);max-height:70vh;border-radius:11px;overflow:hidden;background:#000}
.previewMedia img,.previewMedia video{display:block;max-width:100%;max-height:70vh;width:auto;height:auto;border-radius:11px;object-fit:contain;animation:pvMediaIn .3s ease}
@keyframes pvMediaIn{from{opacity:0}to{opacity:1}}
.previewClose{position:absolute;top:-15px;right:-15px;width:34px;height:34px;border-radius:50%;background:var(--card2);border:2px solid #d8483c;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;transition:transform .18s ease,background .18s ease}
.previewClose:hover{background:#d8483c;color:#fff;transform:rotate(90deg) scale(1.05)}
.previewFooter{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px}
.previewFooter b{font-size:13px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;font-weight:600}
.previewDlBtn{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--gold-dark);color:var(--gold);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.previewDlBtn:hover{background:var(--gold);color:#181205}
.previewLoading{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-dim);padding:56px 60px;font-size:12.5px}
.previewLoading svg{animation:pvSpin .9s linear infinite}
@keyframes pvSpin{to{transform:rotate(360deg)}}
@media(max-width:600px){
  .previewOverlay{padding:16px}
  .previewBox{padding:10px}
  .previewClose{top:-12px;right:-12px;width:30px;height:30px}
}

.menuToggle{display:none;position:fixed;top:16px;left:16px;z-index:70;width:42px;height:42px;border-radius:10px;background:var(--card2);border:1px solid var(--border);color:var(--text);align-items:center;justify-content:center;cursor:pointer}
.sidebarOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45}
.sidebarOverlay.open{display:block}
@media(max-width:1024px){
  .menuToggle{display:flex}
  .sidebar{position:fixed;top:0;left:-270px;height:100vh;transition:left .25s ease;z-index:50}
  .sidebar.open{left:0}
  .main{padding-top:66px}
  .footGrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .main{padding-left:14px;padding-right:14px;padding-bottom:30px}
  .topbar h1{font-size:19px}
  .topbar p{font-size:12.5px}
  .toolbar{gap:8px}
  .searchBox{flex:1 1 100%}
  .pillGroup{gap:6px}
  .pillBtn{padding:8px 12px;font-size:12.5px}
  .panel{padding:12px}
  .footGrid{gap:8px}
  .footItem b{font-size:12px}
  .footItem small{font-size:11px}
  .itemActions{font-size:13px;gap:6px}
  .folderToolbar{gap:6px}
  #bulkBar{padding:8px 10px;gap:8px}
  .dropdownMenu{min-width:135px}
  .modalBox{width:min(290px,92vw)}
}

/* ---------- TOP-RIGHT PROFILE MENU ---------- */
.globalTopBar{display:flex;justify-content:flex-end;margin-bottom:10px}
.topProfileWrap{position:relative}
.topProfileBtn{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold-dark);background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;cursor:pointer;padding:0;background-size:cover;background-position:center;overflow:hidden}
.topProfileBtn:hover{border-color:var(--gold)}
.profileMenu{display:none;position:absolute;top:50px;right:0;background:var(--card);border:1px solid var(--border);border-radius:12px;min-width:224px;box-shadow:0 16px 40px rgba(0,0,0,.5);padding:8px;z-index:90}
.profileMenu.open{display:block}
.profileMenu .pmHead{display:flex;align-items:center;gap:10px;padding:8px 8px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.profileMenu .pmHead .pmAvatar{width:38px;height:38px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 38px;background-size:cover;background-position:center}
.profileMenu .pmHead .pmWho{min-width:0}
.profileMenu .pmHead b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.profileMenu .pmHead small{color:var(--text-dim2);font-size:11px}
.pmItem{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:8px;border:0;background:transparent;color:var(--text);font-size:13px;cursor:pointer;text-align:left;box-sizing:border-box}
.pmItem svg{flex:0 0 16px;width:16px;height:16px;color:var(--text-dim)}
.pmItem:hover{background:var(--card2)}
.pmItem.pmDanger{color:var(--red)}
.pmItem.pmDanger svg{color:var(--red)}
.pmSep{height:1px;background:var(--border);margin:6px 2px}
@media(max-width:600px){
  .topProfileBtn{width:38px;height:38px}
  .profileMenu{min-width:200px;top:46px}
}

/* ===== Micro-animations ===== */
button, .pillBtn, .footItem .thumb, .dropdownMenu div {
  transition: transform .2s ease, box-shadow .2s ease;
}
button:hover, .pillBtn:hover {
  transform: translateY(-1px);
}
.footItem .thumb:hover {
  box-shadow: 0 8px 20px rgba(0,0,0,.4);
}
.dropdownMenu div:hover {
  transform: translateX(2px);
}
</style>
</head>
<body>

<div class="layout">
  <button class="menuToggle" id="menuToggle" onclick="toggleSidebar()" aria-label="Buka menu">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="sidebarOverlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img class="logo" src="https://raw.githubusercontent.com/yaallboy-glitch/kegiatan/refs/heads/main/IMG_6411.png" alt="Logo Karang Taruna">
      <b>KARANG TARUNA</b>
      <span>BRIGADE &bull; MUDA &bull; SOROPATI</span>
    </div>

    <a class="navlink" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      Dashboard
    </a>
    <a class="navlink" href="index.html#bendahara">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 14h4"/></svg>
      Bendahara
    </a>
    <a class="navlink" href="file.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
      File
    </a>
    <a class="navlink active" href="footage.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="15" height="12" rx="2"/><path d="M17 10l5-3v10l-5-3"/></svg>
      Footage
    </a>

    <div class="navSpacer"></div>
    <div class="profileBox">
      <div class="avatar" id="avatarInit">A</div>
      <div class="who">
        <b id="profName">Admin</b>
        <small id="profRole">Administrator</small>
      </div>
      <button class="logoutBtn" title="Logout" onclick="logout()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="globalTopBar">
      <div class="topProfileWrap" id="topProfileWrap">
        <button class="topProfileBtn" id="topProfileBtn" onclick="toggleProfileMenu(event)" title="Akun">
          <span id="topAvatarInit">A</span>
        </button>
        <div class="profileMenu" id="profileMenu">
          <div class="pmHead">
            <div class="pmAvatar" id="pmAvatarInit">A</div>
            <div class="pmWho">
              <b id="pmName">Nama</b>
              <small id="pmRole">Role</small>
            </div>
          </div>
          <label class="pmItem" for="fotoProfilInput" style="cursor:pointer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="13" r="4"/></svg>
            Ganti Foto Profil
          </label>
          <input type="file" id="fotoProfilInput" accept="image/*" style="display:none">
          <button class="pmItem" onclick="goToProfil()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Profil Saya
          </button>
          <button class="pmItem" id="pmAdminBtn" style="display:none" onclick="goToAdminPanel()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/><path d="M9 12l2 2 4-4"/></svg>
            Panel Admin
          </button>
          <div class="pmSep"></div>
          <button class="pmItem pmDanger" onclick="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            Logout
          </button>
        </div>
      </div>
    </div>
    <div class="topbar">
      <div>
        <h1>Manajemen <span>Footage</span></h1>
        <p>Kelola foto dan video dokumentasi kegiatan Karang Taruna.</p>
      </div>
    </div>

    <div class="toolbar">
      <div class="searchBox">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="footSearch" placeholder="Cari footage..." oninput="renderFootage()">
      </div>
      <div class="pillGroup">
        <button class="pillBtn active" data-tipe="" onclick="setTab('',this)">Semua</button>
        <button class="pillBtn" data-tipe="foto" onclick="setTab('foto',this)">Foto</button>
        <button class="pillBtn" data-tipe="video" onclick="setTab('video',this)">Video</button>
      </div>
      <select id="uploadFolder" style="background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 12px;font-size:13px;max-width:170px">
        <option value="">(Tanpa folder)</option>
      </select>
      <input type="text" id="uploadJudul" placeholder="Judul (mis: Bakti Sosial)" style="max-width:200px;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 12px;font-size:13px">
      <input type="file" id="footInput" accept="image/*,video/*" style="display:none" onchange="doUploadFootage()">
      <button class="pillBtn" id="uploadBtn" onclick="document.getElementById('footInput').click()">+ Unggah</button>
      <button class="pillBtn" id="syncBtn" onclick="syncFootage()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Sync Drive</button>
      <button class="pillBtn" id="selectModeBtn" onclick="toggleSelectMode()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></svg>Pilih</button>
    </div>

    <div class="folderToolbar">
      <div class="folderDropdownWrap">
        <button type="button" class="pillBtn" id="folderDropdownBtn" onclick="toggleFolderDropdown(event)">
          <span id="folderDropdownLabel"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>Semua Folder</span><span class="ddArrow">▾</span>
        </button>

            <div style="flex:1"></div>

                <div class="danger" onclick="bulkFolderDeleteFromMenu()"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Hapus</div>
              </div>
            </div>
          </div>

      <button class="pillBtn" onclick="bulkDownload()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>Unduh</button>
      <button class="pillBtn" style="border-color:#5c1f1f;color:#ef4444" onclick="bulkDelete()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Hapus</button>
      <button class="pillBtn" onclick="toggleSelectMode()">Batal</button>
    </div>

    <div id="uploadErr" style="display:none;background:#3a1414;color:#fca5a5;border:1px solid #5c1f1f;padding:11px 12px;border-radius:8px;margin:0 0 14px;font-size:13px"></div>

    <div class="panel">
      <div class="footGrid" id="footageGrid">
        <div class="emptyNote" style="grid-column:1/-1"><p>Memuat data...</p></div>

</div>

<script>
const API = "https://kegiatan-api.newbrigademudasoropati.workers.dev";
const token = localStorage.getItem("token") || "";
if (!token) { location.href = "index.html"; }

// ===== IKON (SVG line-icon simpel, senada dengan ikon sidebar) =====
const ICON = {
  warning: `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;margin-right:5px;flex:0 0 auto"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>`,
  trash:   `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`,
  download:`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>`,
  refresh: `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>`,
  checkSquare: `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></svg>`,
  folder:  `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>`,
  folderSm:`<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px;flex:0 0 auto"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>`,
  starFill:`<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>`,
  starOutline:`<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>`,
  edit:    `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`,
  circleCheck:`<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>`,
  circle:  `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>`,
};

let me = {};
try {
  const payload = atob(token).split("|");
  me = { username: payload[0], nama: payload[1], role: payload[2] };
  document.getElementById("profName").textContent = me.nama;
  document.getElementById("profRole").textContent = me.role;
  document.getElementById("avatarInit").textContent = (me.nama || "?").trim().charAt(0).toUpperCase();

  // ===== TOP-RIGHT PROFILE MENU: isi data & foto profil =====
  document.getElementById("pmName").textContent = me.nama;
  document.getElementById("pmRole").textContent = me.role;
  document.getElementById("pmAdminBtn").style.display = (me.role === "admin" || me.role === "ketua") ? "" : "none";
  applyFotoProfil();
} catch { location.href = "index.html"; }

function logout() { localStorage.removeItem("token"); location.href = "index.html"; }

// ===== TOP-RIGHT PROFILE MENU =====
function toggleProfileMenu(e) {
  e.stopPropagation();
  document.getElementById("profileMenu").classList.toggle("open");
}
document.addEventListener("click", function (e) {
  const wrap = document.getElementById("topProfileWrap");
  const menu = document.getElementById("profileMenu");
  if (wrap && menu && !wrap.contains(e.target)) menu.classList.remove("open");
});

function fotoKey() { return "ktFotoProfil_" + (me.username || "guest"); }

function applyFotoProfil() {
  const saved = localStorage.getItem(fotoKey());
  const initial = (me.nama || "?").trim().charAt(0).toUpperCase();
  [document.getElementById("topProfileBtn"), document.getElementById("pmAvatarInit"), document.getElementById("avatarInit")].forEach(el => {
    if (!el) return;
    if (saved) { el.style.backgroundImage = "url('" + saved + "')"; el.textContent = ""; }
    else { el.style.backgroundImage = ""; el.textContent = initial; }
  });
  const topInit = document.getElementById("topAvatarInit");
  if (topInit) topInit.textContent = saved ? "" : initial;
}

const fotoProfilInputEl = document.getElementById("fotoProfilInput");
if (fotoProfilInputEl) {
  fotoProfilInputEl.addEventListener("change", function (e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) { alert("File harus berupa gambar."); return; }
    const reader = new FileReader();
    reader.onload = function (ev) {
      const img = new Image();
      img.onload = function () {
        const size = 240;
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        try {
          localStorage.setItem(fotoKey(), dataUrl);
          applyFotoProfil();
          document.getElementById("profileMenu").classList.remove("open");
        } catch (err) {
          alert("Gagal menyimpan foto profil (mungkin ukuran terlalu besar).");
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  });
}

function goToProfil() { sessionStorage.setItem("ktOpenProfil", "1"); location.href = "index.html"; }
function goToAdminPanel() { sessionStorage.setItem("ktOpenAdmin", "1"); location.href = "index.html"; }

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sidebarOverlay").classList.toggle("open");
}

function showUploadErr(msg) {
  const b = document.getElementById("uploadErr");
  b.innerHTML = ICON.warning + msg;
  b.style.display = "block";
}
function clearUploadErr() {
  document.getElementById("uploadErr").style.display = "none";
}

async function apiGet(path) {
  const r = await fetch(API + path, { headers: { Authorization: "Bearer " + token } });
  if (r.status === 401) { logout(); throw new Error("Sesi habis, silakan login lagi."); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || ("Error " + r.status));
  return d;
}
async function apiUpload(path, formData) {
  const r = await fetch(API + path, { method: "POST", headers: { Authorization: "Bearer " + token }, body: formData });
  if (r.status === 401) { logout(); throw new Error("Sesi habis, silakan login lagi."); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || ("Error " + r.status));
  return d;
}
async function apiDelete(path) {
  const r = await fetch(API + path, { method: "DELETE", headers: { Authorization: "Bearer " + token } });
  if (r.status === 401) { logout(); throw new Error("Sesi habis, silakan login lagi."); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || ("Error " + r.status));
  return d;
}

function fmtDate(iso) {
  try {
    return new Date(iso.replace(" ", "T") + "Z").toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
  } catch { return iso; }
}

let allFootage = [];
let allFolders = [];
let currentTipe = "";
let currentFolderId = "ALL"; // "ALL" | "ROOT" | angka id folder (string)
let moveTargetId = null;
let moveIsBulk = false;
let selectMode = false;
let selectedIds = new Set();
const thumbCache = {};

async function loadFootage() {
  try {
    allFootage = await apiGet("/footage" + (currentTipe ? "?tipe=" + currentTipe : ""));
    renderFootage();
  } catch (err) {
    document.getElementById("footageGrid").innerHTML =
      `<div class="emptyNote" style="grid-column:1/-1"><b>Gagal memuat footage</b><p>${err.message}</p></div>`;
  }
}

async function loadFolders() {
  try {
    allFolders = await apiGet("/footage/folders");
  } catch {
    allFolders = [];
  }
  renderFolderTabs();
  renderUploadFolderSelect();
}

let selectedFolderIds = new Set();

function renderFolderTabs() {
  const label = document.getElementById("folderDropdownLabel");
  let labelText = "Semua Folder";
  if (currentFolderId === "ROOT") labelText = "Tanpa Folder";
  else if (currentFolderId !== "ALL") {
    const f = allFolders.find(x => String(x.id) === String(currentFolderId));
    labelText = f ? f.nama : "Semua Folder";
  }
  label.innerHTML = ICON.folderSm + escapeHtml(labelText);
  label.title = labelText;

  const rows = [
    { val: "ALL", label: "Semua Folder", checkable: false },
    { val: "ROOT", label: "Tanpa Folder", checkable: false },
    ...allFolders.map(f => ({ val: String(f.id), label: f.nama, rawName: f.nama, checkable: true })),
  ];

  document.getElementById("folderDropdownList").innerHTML = rows.map(r => `
    <div class="folderRow ${String(currentFolderId)===String(r.val)?'active':''}">
      ${r.checkable
        ? `<span class="folderCheck" onclick="toggleFolderSelect(event,'${r.val}')">${selectedFolderIds.has(r.val) ? ICON.circleCheck : ICON.circle}</span>`
        : `<span style="width:16px;flex:0 0 auto"></span>`}
      <span class="folderRowName" title="${escapeAttr(r.rawName || r.label)}" onclick="openFolderFromDropdown('${r.val}')">${ICON.folderSm}${escapeHtml(r.label)}</span>
    </div>
  `).join("");

  renderFolderBulkBar();
}

function toggleFolderDropdown(ev) {
  ev.stopPropagation();
  document.getElementById("folderDropdownPanel").classList.toggle("open");
}
document.addEventListener("click", (e) => {
  const panel = document.getElementById("folderDropdownPanel");
  const wrap = document.getElementById("folderDropdownBtn")?.closest(".folderDropdownWrap");
  if (panel && wrap && !wrap.contains(e.target)) panel.classList.remove("open");
});

function openFolderFromDropdown(val) {
  setFolderTab(val);
  selectedFolderIds.clear();
  renderFolderTabs();
  document.getElementById("folderDropdownPanel").classList.remove("open");
}

function toggleFolderSelect(ev, val) {
  ev.stopPropagation();
  if (selectedFolderIds.has(val)) selectedFolderIds.delete(val);
  else selectedFolderIds.add(val);
  renderFolderTabs();
  document.getElementById("folderDropdownPanel").classList.add("open");
}

function renderFolderBulkBar() {
  const bar = document.getElementById("folderBulkBar");
  const n = selectedFolderIds.size;
  if (n === 0) { bar.style.display = "none"; return; }
  bar.style.display = "flex";
  document.getElementById("folderBulkCount").textContent = n + " dipilih";
  document.getElementById("folderBulkRenameItem").style.display = n === 1 ? "block" : "none";
}

function toggleFolderBulkMenu(ev) {
  ev.stopPropagation();
  document.getElementById("folderBulkMenu").classList.toggle("open");
}

async function renameFolder(id, oldNama) {
  const nama = prompt("Nama folder baru:", oldNama);
  if (!nama || !nama.trim() || nama.trim() === oldNama) return;
  try {
    await apiPost("/footage/folders/rename", { id, nama: nama.trim() });
    await loadFolders();
    await loadFootage();
  } catch (err) {
    showUploadErr(err.message);
  }
}

async function bulkFolderRenameFromMenu() {
  const id = Array.from(selectedFolderIds)[0];
  const f = allFolders.find(x => String(x.id) === String(id));
  document.getElementById("folderBulkMenu").classList.remove("open");
  if (!f) return;
  await renameFolder(f.id, f.nama);
  selectedFolderIds.clear();
  renderFolderTabs();
}

async function bulkFolderDeleteFromMenu() {
  const ids = Array.from(selectedFolderIds);
  document.getElementById("folderBulkMenu").classList.remove("open");
  if (ids.length === 0) return;
  const names = ids.map(id => { const f = allFolders.find(x => String(x.id) === String(id)); return f ? f.nama : id; }).join(", ");
  if (!confirm(`Hapus ${ids.length} folder (${names})? Footage di dalamnya akan dipindahkan ke "Tanpa Folder".`)) return;
  for (const id of ids) {
    try {
      await fetch(API + "/footage/folders?id=" + id, { method: "DELETE", headers: { Authorization: "Bearer " + token } });
    } catch {}
  }
  if (ids.includes(String(currentFolderId))) currentFolderId = "ALL";
  selectedFolderIds.clear();
  await loadFolders();
  await loadFootage();
}

function renderUploadFolderSelect() {
  const sel = document.getElementById("uploadFolder");
  sel.innerHTML = `<option value="">(Tanpa folder)</option>` +
    allFolders.map(f => `<option value="${f.id}">${escapeHtml(f.nama)}</option>`).join("");
}

function setFolderTab(val) {
  currentFolderId = val;
  renderFolderTabs();
  renderFootage();
}

function escapeHtml(s) { return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function escapeAttr(s) { return (s || "").replace(/'/g, "\\'"); }

function renderFootage() {
  const q = (document.getElementById("footSearch").value || "").toLowerCase();
  let rows = allFootage.filter(f => f.judul.toLowerCase().includes(q));
  if (currentFolderId === "ROOT") rows = rows.filter(f => !f.folder_id);
  else if (currentFolderId !== "ALL") rows = rows.filter(f => String(f.folder_id) === String(currentFolderId));

  const grid = document.getElementById("footageGrid");
  if (rows.length === 0) {
    grid.innerHTML = `<div class="emptyNote" style="grid-column:1/-1">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="6" width="15" height="12" rx="2"/><path d="M17 10l5-3v10l-5-3"/></svg>
      <b>Belum ada footage</b><p>Klik "+ Unggah" untuk menambahkan foto/video pertama.</p>
    </div>`;
    return;
  }
  grid.innerHTML = rows.map(f => `
    <div class="footItem">
      <div class="thumb" id="thumb-${f.id}" onclick="${selectMode ? `toggleSelectFromThumb(${f.id})` : `viewFootage(${f.id},'${f.mime_type}')`}" style="cursor:pointer;background-size:cover;background-position:center">
        ${selectMode ? `<input type="checkbox" class="selectCheck" id="chk-${f.id}" onclick="event.stopPropagation();toggleSelectItem(${f.id},this.checked)" ${selectedIds.has(f.id) ? "checked" : ""}>` : ""}
        ${f.starred ? `<span class="starBadge" style="color:#e0ac2b">${ICON.starFill}</span>` : ""}
        <span class="typeIcon" id="typeicon-${f.id}">${f.tipe === "video"
          ? `<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>`
          : `<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M22 16l-5.5-5-8.5 8"/></svg>`}</span>
      </div>
      <b title="${escapeAttr(f.judul)}">${escapeHtml(f.judul)}</b><small>${fmtDate(f.uploaded_at)}</small>
      ${selectMode ? "" : `
      <div class="itemMenuWrap">
        <button class="dotsBtn" onclick="toggleItemMenu(event,${f.id})">⋮</button>
        <div class="dropdownMenu" id="menu-${f.id}">
          <div onclick="toggleStar(${f.id})">${f.starred ? ICON.starFill.replace('width="13" height="13"','width="13" height="13" style="vertical-align:-2px;margin-right:5px"') + "Batal tandai" : ICON.starOutline + "Tandai"}</div>
          <div onclick="renameFootage(${f.id},'${escapeAttr(f.judul)}')">${ICON.edit}Ganti nama</div>
          <div onclick="openMoveDialog(${f.id})">${ICON.folder}Pindahkan</div>
          <div onclick="downloadFootage(${f.id},'${escapeAttr(f.judul)}')"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>Unduh</div>
          <div class="danger" onclick="deleteFootage(${f.id})"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Hapus</div>
        </div>
      </div>`}
    </div>
  `).join("");

  rows.forEach(f => loadThumb(f.id));
}

async function loadThumb(id) {
  if (thumbCache[id]) {
    applyThumb(id, thumbCache[id]);
    return;
  }
  try {
    const r = await fetch(API + "/footage/thumb?id=" + id, { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) return;
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    thumbCache[id] = url;
    applyThumb(id, url);
  } catch {}
}
function applyThumb(id, url) {
  const el = document.getElementById("thumb-" + id);
  if (el) el.style.backgroundImage = `url(${url})`;
  const icon = document.getElementById("typeicon-" + id);
  if (icon) icon.style.display = "none";
}

function toggleItemMenu(ev, id) {
  ev.stopPropagation();
  document.querySelectorAll(".dropdownMenu.open").forEach(m => { if (m.id !== "menu-" + id) m.classList.remove("open"); });
  document.getElementById("menu-" + id).classList.toggle("open");
}
document.addEventListener("click", () => {
  document.querySelectorAll(".dropdownMenu.open").forEach(m => m.classList.remove("open"));
});

let previewCurrentId = null;
let previewCurrentTitle = "";
let previewObjectUrl = null;

async function viewFootage(id, mime) {
  const item = allFootage.find(x => x.id === id);
  previewCurrentId = id;
  previewCurrentTitle = item ? item.judul : "footage";

  document.getElementById("previewTitle").textContent = previewCurrentTitle;
  const media = document.getElementById("previewMedia");
  media.innerHTML = `<div class="previewLoading">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    Memuat pratinjau...
  </div>`;
  document.getElementById("previewOverlay").classList.add("open");
  document.body.style.overflow = "hidden";

  try {
    const r = await fetch(API + "/footage/view?id=" + id, { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) { const d = await r.json(); throw new Error(d.error || "Gagal memuat"); }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    previewObjectUrl = url;
    if (previewCurrentId !== id) return;
    if ((mime || "").startsWith("video/")) {
      media.innerHTML = `<video src="${url}" controls autoplay playsinline></video>`;
    } else {
      media.innerHTML = `<img src="${url}" alt="${escapeAttr(previewCurrentTitle)}">`;
    }
  } catch (err) {
    media.innerHTML = `<div class="previewLoading" style="color:#f87171">${ICON.warning}${err.message}</div>`;
  }
}

function closePreview() {
  document.getElementById("previewOverlay").classList.remove("open");
  document.body.style.overflow = "";
  document.getElementById("previewMedia").innerHTML = "";
  if (previewObjectUrl) { URL.revokeObjectURL(previewObjectUrl); previewObjectUrl = null; }
  previewCurrentId = null;
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePreview(); });

async function doUploadFootage() {
  clearUploadErr();
  const input = document.getElementById("footInput");
  const file = input.files[0];
  if (!file) return;
  const judul = document.getElementById("uploadJudul").value || file.name;
  const folderId = document.getElementById("uploadFolder").value;
  const btn = document.getElementById("uploadBtn");
  btn.textContent = "Mengunggah..."; btn.disabled = true;
  try {
    const fd = new FormData();
    fd.append("file", file);
    fd.append("judul", judul);
    if (folderId) fd.append("folder_id", folderId);
    await apiUpload("/footage", fd);
    input.value = "";
    document.getElementById("uploadJudul").value = "";
    await loadFootage();
  } catch (err) {
    showUploadErr(err.message);
  } finally {
    btn.textContent = "+ Unggah"; btn.disabled = false;
  }
}

async function deleteFootage(id) {
  if (!confirm("Hapus footage ini?")) return;
  try {
    await apiDelete("/footage?id=" + id);
    await loadFootage();
  } catch (err) {
    showUploadErr(err.message);
  }
}

async function apiPost(path, bodyObj) {
  const r = await fetch(API + path, {
    method: "POST",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify(bodyObj),
  });
  if (r.status === 401) { logout(); throw new Error("Sesi habis, silakan login lagi."); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || ("Error " + r.status));
  return d;
}

async function renameFootage(id, oldJudul) {
  const judul = prompt("Nama baru:", oldJudul);
  if (!judul || judul.trim() === "" || judul === oldJudul) return;
  try {
    await apiPost("/footage/rename", { id, judul: judul.trim() });
    await loadFootage();
  } catch (err) {
    showUploadErr(err.message);
  }
}

async function toggleStar(id) {
  try {
    await apiPost("/footage/star", { id });
    await loadFootage();
  } catch (err) {
    showUploadErr(err.message);
  }
}

async function downloadFootage(id, judul) {
  try {
    const r = await fetch(API + "/footage/download?id=" + id, { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) { const d = await r.json(); throw new Error(d.error || "Gagal mengunduh"); }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = judul;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    showUploadErr(err.message);
  }
}

function openMoveDialog(id) {
  moveIsBulk = false;
  moveTargetId = id;
  const sel = document.getElementById("moveFolderSelect");
  sel.innerHTML = `<option value="">(Tanpa folder / root)</option>` +
    allFolders.map(f => `<option value="${f.id}">${escapeHtml(f.nama)}</option>`).join("");
  const current = allFootage.find(x => x.id === id);
  if (current && current.folder_id) sel.value = current.folder_id;
  document.getElementById("moveModal").classList.add("open");
}
function openBulkMoveDialog() {
  if (selectedIds.size === 0) return;
  moveIsBulk = true;
  moveTargetId = null;
  const sel = document.getElementById("moveFolderSelect");
  sel.innerHTML = `<option value="">(Tanpa folder / root)</option>` +
    allFolders.map(f => `<option value="${f.id}">${escapeHtml(f.nama)}</option>`).join("");
  document.getElementById("moveModal").classList.add("open");
}
function closeMoveModal() {
  document.getElementById("moveModal").classList.remove("open");
  moveTargetId = null;
  moveIsBulk = false;
}
async function confirmMove() {
  const folderId = document.getElementById("moveFolderSelect").value;
  try {
    if (moveIsBulk) {
      await apiPost("/footage/move-bulk", { ids: Array.from(selectedIds), folder_id: folderId || null });
      selectedIds.clear();
    } else {
      if (!moveTargetId) return;
      await apiPost("/footage/move", { id: moveTargetId, folder_id: folderId || null });
    }
    closeMoveModal();
    await loadFootage();
    renderBulkBar();
  } catch (err) {
    showUploadErr(err.message);
  }
}

function toggleSelectMode() {
  selectMode = !selectMode;
  selectedIds.clear();
  document.getElementById("selectModeBtn").classList.toggle("active", selectMode);
  renderBulkBar();
  renderFootage();
}
function toggleSelectItem(id, checked) {
  if (checked) selectedIds.add(id); else selectedIds.delete(id);
  renderBulkBar();
}
function toggleSelectFromThumb(id) {
  const chk = document.getElementById("chk-" + id);
  if (!chk) return;
  chk.checked = !chk.checked;
  toggleSelectItem(id, chk.checked);
}
function renderBulkBar() {
  const bar = document.getElementById("bulkBar");
  if (!selectMode || selectedIds.size === 0) { bar.style.display = "none"; return; }
  bar.style.display = "flex";
  document.getElementById("bulkCount").textContent = selectedIds.size + " dipilih";
}
async function bulkDelete() {
  if (selectedIds.size === 0) return;
  if (!confirm(`Hapus ${selectedIds.size} footage terpilih? Tindakan ini tidak bisa dibatalkan.`)) return;
  try {
    await apiPost("/footage/delete-bulk", { ids: Array.from(selectedIds) });
    selectedIds.clear();
    renderBulkBar();
    await loadFootage();
  } catch (err) {
    showUploadErr(err.message);
  }
}
async function bulkDownload() {
  if (selectedIds.size === 0) return;
  const ids = Array.from(selectedIds);
  for (const id of ids) {
    const item = allFootage.find(f => f.id === id);
    await downloadFootage(id, item ? item.judul : ("footage-" + id));
    await new Promise(res => setTimeout(res, 400));
  }
}

async function createFolder() {
  const nama = prompt("Nama folder baru:");
  if (!nama || !nama.trim()) return;
  try {
    await apiPost("/footage/folders", { nama: nama.trim() });
    await loadFolders();
  } catch (err) {
    showUploadErr(err.message);
  }
}

async function syncFootage() {
  clearUploadErr();
  const btn = document.getElementById("syncBtn");
  const oldText = btn.textContent;
  btn.textContent = "Menyinkronkan..."; btn.disabled = true;
  try {
    const r = await fetch(API + "/footage/sync", { method: "POST", headers: { Authorization: "Bearer " + token } });
    const d = await r.json();
    if (r.status === 401) { logout(); return; }
    if (!r.ok) throw new Error(d.error || ("Error " + r.status));
    await loadFootage();
    alert(`Sync selesai. ${d.added} file baru ditambahkan dari Drive (total di folder Drive: ${d.total_di_drive}).`);
  } catch (err) {
    showUploadErr(err.message);
  } finally {
    btn.textContent = oldText; btn.disabled = false;
  }
}

function setTab(tipe, btn) {
  document.querySelectorAll(".pillGroup .pillBtn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentTipe = tipe;
  loadFootage();
}

loadFolders();
loadFootage();
</script>
<script src="chat-widget.js"></script>
</body>
