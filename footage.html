<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karang Taruna | Footage</title>
<style>
:root{
  --bg:#0a0a0b;--bg-soft:#0d0d0f;--card:#161618;--card2:#1b1b1e;--border:#2a2a2e;
  --gold:#e0ac2b;--gold-soft:#caa23c33;--gold-dark:#8a6d1f;
  --text:#f4f4f5;--text-dim:#9ca0a8;--text-dim2:#6b6f76;
}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;margin:0;background:var(--bg);color:var(--text)}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

.layout{display:flex;min-height:100vh}
.sidebar{width:250px;flex:0 0 250px;background:var(--bg-soft);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;padding-bottom:20px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.brand .logo{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#0a0a0b;margin-bottom:10px;border:3px solid #0a0a0b;box-shadow:0 0 0 2px var(--gold)}
.brand b{font-size:15px;letter-spacing:.4px}
.brand span{font-size:10.5px;color:var(--gold);letter-spacing:.6px;margin-top:2px}
.navlink{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:9px;color:var(--text-dim);font-size:14px;font-weight:500;cursor:pointer;margin-bottom:4px;border:0;background:transparent;width:100%;text-align:left}
.navlink svg{flex:0 0 18px;width:18px;height:18px}
.navlink:hover{background:var(--card2);color:var(--text)}
.navlink.active{background:linear-gradient(90deg,#e0ac2b,#c9932a);color:#181205;font-weight:700}
.navSpacer{flex:1}
.profileBox{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--card2);border:1px solid var(--border)}
.profileBox .avatar{width:34px;height:34px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 34px}
.profileBox .who{flex:1;min-width:0}
.profileBox .who b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profileBox .who small{color:var(--text-dim2);font-size:10.5px}
.logoutBtn{background:transparent;border:0;color:var(--text-dim2);cursor:pointer;padding:4px}
.logoutBtn:hover{color:#ef4444}

.main{flex:1;min-width:0;padding:26px 30px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.topbar h1{font-size:22px;margin:0}
.topbar h1 span{color:var(--gold)}
.topbar p{margin:4px 0 0;color:var(--text-dim);font-size:13.5px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.searchBox{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:9px 12px}
.searchBox input{background:transparent;border:0;outline:0;color:var(--text);font-size:13.5px;width:100%}
.searchBox svg{color:var(--text-dim2);flex:0 0 auto}
.pillGroup{display:flex;gap:8px}
.pillBtn{border:1px solid var(--gold-dark);color:var(--gold);background:transparent;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.pillBtn.active,.pillBtn:hover{background:var(--gold);color:#181205}

.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.footGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.footItem{position:relative}
.footItem .thumb{aspect-ratio:1/1;border-radius:12px;background:linear-gradient(150deg,#2a2413,#3a2f14);display:flex;align-items:center;justify-content:center;color:var(--gold-dark);margin-bottom:7px;position:relative}
.footItem b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.footItem small{color:var(--text-dim2);font-size:11.5px}
.starBadge{position:absolute;top:6px;right:6px;font-size:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.itemActions{display:flex;gap:8px;margin-top:5px;font-size:14px}
.itemActions span{cursor:pointer;color:var(--text-dim2)}
.itemActions span:hover{color:var(--gold)}
.itemActions span.danger:hover{color:#ef4444}

.itemMenuWrap{position:relative;margin-top:5px}
.dotsBtn{background:var(--card2);border:1px solid var(--border);color:var(--text-dim);width:26px;height:22px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1}
.dotsBtn:hover{color:var(--gold);border-color:var(--gold-dark)}
.dropdownMenu{display:none;position:absolute;left:0;top:26px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:150px;z-index:20;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.dropdownMenu.open{display:block}
.dropdownMenu div{padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.dropdownMenu div:hover{background:var(--card)}
.dropdownMenu div.danger{color:#ef4444}

.selectCheck{position:absolute;top:6px;left:6px;width:19px;height:19px;z-index:6;cursor:pointer;accent-color:var(--gold)}

#bulkBar{display:none;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--gold-dark);border-radius:10px;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap}

.folderToolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.folderPill{display:inline-flex;align-items:center;gap:2px}
.folderPill .rm{cursor:pointer;color:var(--text-dim2);padding:2px 6px;margin-left:-6px;font-size:12px}
.folderPill .rm:hover{color:#ef4444}

.modalOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;align-items:center;justify-content:center}
.modalOverlay.open{display:flex}
.modalBox{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;width:290px}
.modalBox h3{margin:0 0 12px;font-size:15px}
.modalBox select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px;margin-bottom:14px;font-size:13.5px}
.modalActions{display:flex;gap:8px;justify-content:flex-end}

.menuToggle{display:none;position:fixed;top:16px;left:16px;z-index:70;width:42px;height:42px;border-radius:10px;background:var(--card2);border:1px solid var(--border);color:var(--text);align-items:center;justify-content:center;cursor:pointer}
.sidebarOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45}
.sidebarOverlay.open{display:block}
@media(max-width:1024px){
  .menuToggle{display:flex}
  .sidebar{position:fixed;top:0;left:-270px;height:100vh;transition:left .25s ease;z-index:50}
  .sidebar.open{left:0}
  .main{padding-top:66px}
  .footGrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .main{padding-left:14px;padding-right:14px;padding-bottom:30px}
  .topbar h1{font-size:19px}
  .topbar p{font-size:12.5px}
  .toolbar{gap:8px}
  .searchBox{flex:1 1 100%}
  .pillGroup{gap:6px}
  .pillBtn{padding:8px 12px;font-size:12.5px}
  .panel{padding:12px}
  .footGrid{gap:8px}
  .footItem b{font-size:12px}
  .footItem small{font-size:11px}
  .itemActions{font-size:13px;gap:6px}
  .folderToolbar{gap:6px}
  #bulkBar{padding:8px 10px;gap:8px}
  .dropdownMenu{min-width:135px}
  .modalBox{width:min(290px,92vw)}
}
</style>
</head>
<body>

<div class="layout">
  <button class="menuToggle" id="menuToggle" onclick="toggleSidebar()" aria-label="Buka menu">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="sidebarOverlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img class="logo" src="https://raw.githubusercontent.com/yaallboy-glitch/kegiatan/refs/heads/main/IMG_6411.png" alt="Logo Karang Taruna">
      <b>KARANG TARUNA</b>
      <span>BRIGADE &bull; MUDA &bull; SOROPATI</span>
    </div>

    <a class="navlink" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      Dashboard
    </a>
    <a class="navlink" href="index.html#bendahara">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 14h4"/></svg>
      Bendahara
    </a>
    <a class="navlink" href="file.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
      File
    </a>
    <a class="navlink active" href="footage.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="15" height="12" rx="2"/><path d="M17 10l5-3v10l-5-3"/></svg>
      Footage
    </a>

    <div class="navSpacer"></div>
    <div class="profileBox">
      <div class="avatar" id="avatarInit">A</div>
      <div class="who">
        <b id="profName">Admin</b>
        <small id="profRole">Administrator</small>
      </div>
      <button class="logoutBtn" title="Logout" onclick="logout()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Manajemen <span>Footage</span></h1>
        <p>Kelola foto dan video dokumentasi kegiatan Karang Taruna.</p>
      </div>
    </div>

    <div class="toolbar">
      <div class="searchBox">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="footSearch" placeholder="Cari footage..." oninput="renderFootage()">
      </div>
      <div class="pillGroup">
        <button class="pillBtn active" data-tipe="" onclick="setTab('',this)">Semua</button>
        <button class="pillBtn" data-tipe="foto" onclick="setTab('foto',this)">Foto</button>
        <button class="pillBtn" data-tipe="video" onclick="setTab('video',this)">Video</button>
      </div>
      <select id="uploadFolder" style="background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 12px;font-size:13px;max-width:170px">
        <option value="">(Tanpa folder)</option>
      </select>
      <input type="text" id="uploadJudul" placeholder="Judul (mis: Bakti Sosial)" style="max-width:200px;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 12px;font-size:13px">
      <input type="file" id="footInput" accept="image/*,video/*" style="display:none" onchange="doUploadFootage()">
      <button class="pillBtn" id="uploadBtn" onclick="document.getElementById('footInput').click()">+ Unggah</button>
      <button class="pillBtn" id="syncBtn" onclick="syncFootage()">🔄 Sync Drive</button>
      <button class="pillBtn" id="selectModeBtn" onclick="toggleSelectMode()">☑️ Pilih</button>
    </div>

    <div class="folderToolbar">
      <div class="pillGroup" id="folderTabs">
        <button class="pillBtn active" onclick="setFolderTab('ALL',this)">📁 Semua</button>
      </div>
      <button class="pillBtn" onclick="createFolder()">+ Folder Baru</button>
    </div>

    <div id="bulkBar">
      <b id="bulkCount" style="font-size:13px"></b>
      <div style="flex:1"></div>
      <button class="pillBtn" onclick="openBulkMoveDialog()">📁 Pindahkan</button>
      <button class="pillBtn" onclick="bulkDownload()">⬇️ Unduh</button>
      <button class="pillBtn" style="border-color:#5c1f1f;color:#ef4444" onclick="bulkDelete()">🗑️ Hapus</button>
      <button class="pillBtn" onclick="toggleSelectMode()">Batal</button>
    </div>

    <div id="uploadErr" style="display:none;background:#3a1414;color:#fca5a5;border:1px solid #5c1f1f;padding:11px 12px;border-radius:8px;margin:0 0 14px;font-size:13px"></div>

    <div class="panel">
      <div class="footGrid" id="footageGrid">
        <div class="emptyNote" style="grid-column:1/-1"><p>Memuat data...</p></div>
      </div>
    </div>
  </main>
</div>

<div class="modalOverlay" id="moveModal">
  <div class="modalBox">
    <h3>Pindahkan ke folder</h3>
    <select id="moveFolderSelect"></select>
    <div class="modalActions">
      <button class="pillBtn" onclick="closeMoveModal()">Batal</button>
      <button class="pillBtn" style="background:var(--gold);color:#181205" onclick="confirmMove()">Pindahkan</button>
    </div>
  </div>
</div>

<script>
const API = "https://kegiatan-api.newbrigademudasoropati.workers.dev";
const token = localStorage.getItem("token") || "";
if (!token) { location.href = "index.html"; }

let me = {};
try {
  const payload = atob(token).split("|");
  me = { username: payload[0], nama: payload[1], role: payload[2] };
  document.getElementById("profName").textContent = me.nama;
  document.getElementById("profRole").textContent = me.role;
  document.getElementById("avatarInit").textContent = (me.nama || "?").trim().charAt(0).toUpperCase();
} catch { location.href = "index.html"; }

function logout() { localStorage.removeItem("token"); location.href = "index.html"; }

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sidebarOverlay").classList.toggle("open");
}

function showUploadErr(msg) {
  const b = document.getElementById("uploadErr");
  b.textContent = "⚠️ " + msg;
  b.style.display = "block";
}
function clearUploadErr() {
  document.getElementById("uploadErr").style.display = "none";
}

async function apiGet(path) {
  const r = await fetch(API + path, { headers: { Authorization: "Bearer " + token } });
  if (r.status === 401) { logout(); throw new Error("Sesi habis, silakan login lagi."); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || ("Error " + r.status));
  return d;
}
async function apiUpload(path, formData) {
  const r = await fetch(API + path, { method: "POST", headers: { Authorization: "Bearer " + token }, body: formData });
  if (r.status === 401) { logout(); throw new Error("Sesi habis, silakan login lagi."); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || ("Error " + r.status));
  return d;
}
async function apiDelete(path) {
  const r = await fetch(API + path, { method: "DELETE", headers: { Authorization: "Bearer " + token } });
  if (r.status === 401) { logout(); throw new Error("Sesi habis, silakan login lagi."); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || ("Error " + r.status));
  return d;
}

function fmtDate(iso) {
  try {
    return new Date(iso.replace(" ", "T") + "Z").toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
  } catch { return iso; }
}

let allFootage = [];
let allFolders = [];
let currentTipe = "";
let currentFolderId = "ALL"; // "ALL" | "ROOT" | angka id folder (string)
let moveTargetId = null;
let moveIsBulk = false;
let selectMode = false;
let selectedIds = new Set();
const thumbCache = {};

async function loadFootage() {
  try {
    allFootage = await apiGet("/footage" + (currentTipe ? "?tipe=" + currentTipe : ""));
    renderFootage();
  } catch (err) {
    document.getElementById("footageGrid").innerHTML =
      `<div class="emptyNote" style="grid-column:1/-1"><b>Gagal memuat footage</b><p>${err.message}</p></div>`;
  }
}

async function loadFolders() {
  try {
    allFolders = await apiGet("/footage/folders");
  } catch {
    allFolders = [];
  }
  renderFolderTabs();
  renderUploadFolderSelect();
}

function renderFolderTabs() {
  const wrap = document.getElementById("folderTabs");
  wrap.innerHTML = `
    <button class="pillBtn ${currentFolderId==='ALL'?'active':''}" onclick="setFolderTab('ALL',this)">📁 Semua</button>
    <button class="pillBtn ${currentFolderId==='ROOT'?'active':''}" onclick="setFolderTab('ROOT',this)">🗂 Tanpa Folder</button>
  ` + allFolders.map(f => `
    <span class="folderPill">
      <button class="pillBtn ${String(currentFolderId)===String(f.id)?'active':''}" onclick="setFolderTab('${f.id}',this)">📁 ${escapeHtml(f.nama)}</button>
      <div class="itemMenuWrap" style="margin-top:0">
        <button class="dotsBtn" title="Menu folder" onclick="toggleFolderMenu(event,${f.id})">⋮</button>
        <div class="dropdownMenu" id="foldermenu-${f.id}">
          <div onclick="renameFolder(${f.id},'${escapeAttr(f.nama)}')">✏️ Ganti nama</div>
          <div class="danger" onclick="deleteFolder(${f.id},'${escapeAttr(f.nama)}')">🗑️ Hapus</div>
        </div>
      </div>
    </span>
  `).join("");
}
function toggleFolderMenu(ev, id) {
  ev.stopPropagation();
  document.querySelectorAll(".dropdownMenu.open").forEach(m => { if (m.id !== "foldermenu-" + id) m.classList.remove("open"); });
  document.getElementById("foldermenu-" + id).classList.toggle("open");
}
async function renameFolder(id, oldNama) {
  const nama = prompt("Nama folder baru:", oldNama);
  if (!nama || !nama.trim() || nama.trim() === oldNama) return;
  try {
    await apiPost("/footage/folders/rename", { id, nama: nama.trim() });
    await loadFolders();
    await loadFootage();
  } catch (err) {
    showUploadErr(err.message);
  }
}

function renderUploadFolderSelect() {
  const sel = document.getElementById("uploadFolder");
  sel.innerHTML = `<option value="">(Tanpa folder)</option>` +
    allFolders.map(f => `<option value="${f.id}">${escapeHtml(f.nama)}</option>`).join("");
}

function setFolderTab(val, btn) {
  document.querySelectorAll("#folderTabs .pillBtn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentFolderId = val;
  renderFootage();
}

function escapeHtml(s) { return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function escapeAttr(s) { return (s || "").replace(/'/g, "\\'"); }

function renderFootage() {
  const q = (document.getElementById("footSearch").value || "").toLowerCase();
  let rows = allFootage.filter(f => f.judul.toLowerCase().includes(q));
  if (currentFolderId === "ROOT") rows = rows.filter(f => !f.folder_id);
  else if (currentFolderId !== "ALL") rows = rows.filter(f => String(f.folder_id) === String(currentFolderId));

  const grid = document.getElementById("footageGrid");
  if (rows.length === 0) {
    grid.innerHTML = `<div class="emptyNote" style="grid-column:1/-1">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="6" width="15" height="12" rx="2"/><path d="M17 10l5-3v10l-5-3"/></svg>
      <b>Belum ada footage</b><p>Klik "+ Unggah" untuk menambahkan foto/video pertama.</p>
    </div>`;
    return;
  }
  grid.innerHTML = rows.map(f => `
    <div class="footItem">
      <div class="thumb" id="thumb-${f.id}" onclick="${selectMode ? `toggleSelectFromThumb(${f.id})` : `viewFootage(${f.id},'${f.mime_type}')`}" style="cursor:pointer;background-size:cover;background-position:center">
        ${selectMode ? `<input type="checkbox" class="selectCheck" id="chk-${f.id}" onclick="event.stopPropagation();toggleSelectItem(${f.id},this.checked)" ${selectedIds.has(f.id) ? "checked" : ""}>` : ""}
        ${f.starred ? `<span class="starBadge">⭐</span>` : ""}
        <span class="typeIcon" id="typeicon-${f.id}">${f.tipe === "video"
          ? `<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>`
          : `<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M22 16l-5.5-5-8.5 8"/></svg>`}</span>
      </div>
      <b title="${escapeAttr(f.judul)}">${escapeHtml(f.judul)}</b><small>${fmtDate(f.uploaded_at)}</small>
      ${selectMode ? "" : `
      <div class="itemMenuWrap">
        <button class="dotsBtn" onclick="toggleItemMenu(event,${f.id})">⋮</button>
        <div class="dropdownMenu" id="menu-${f.id}">
          <div onclick="toggleStar(${f.id})">${f.starred ? "⭐ Batal tandai" : "☆ Tandai"}</div>
          <div onclick="renameFootage(${f.id},'${escapeAttr(f.judul)}')">✏️ Ganti nama</div>
          <div onclick="openMoveDialog(${f.id})">📁 Pindahkan</div>
          <div onclick="downloadFootage(${f.id},'${escapeAttr(f.judul)}')">⬇️ Unduh</div>
          <div class="danger" onclick="deleteFootage(${f.id})">🗑️ Hapus</div>
        </div>
      </div>`}
    </div>
  `).join("");

  // muat thumbnail kecil (bukan file asli) biar ringan, untuk foto & video
  rows.forEach(f => loadThumb(f.id));
}

async function loadThumb(id) {
  if (thumbCache[id]) {
    applyThumb(id, thumbCache[id]);
    return;
  }
  try {
    const r = await fetch(API + "/footage/thumb?id=" + id, { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) return; // biarkan ikon default kalau thumbnail belum tersedia
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    thumbCache[id] = url;
    applyThumb(id, url);
  } catch {}
}
function applyThumb(id, url) {
  const el = document.getElementById("thumb-" + id);
  if (el) el.style.backgroundImage = `url(${url})`;
  const icon = document.getElementById("typeicon-" + id);
  if (icon) icon.style.display = "none";
}

function toggleItemMenu(ev, id) {
  ev.stopPropagation();
  document.querySelectorAll(".dropdownMenu.open").forEach(m => { if (m.id !== "menu-" + id) m.classList.remove("open"); });
  document.getElementById("menu-" + id).classList.toggle("open");
}
document.addEventListener("click", () => {
  document.querySelectorAll(".dropdownMenu.open").forEach(m => m.classList.remove("open"));
});

async function viewFootage(id, mime) {
  try {
    const r = await fetch(API + "/footage/view?id=" + id, { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) { const d = await r.json(); throw new Error(d.error || "Gagal memuat"); }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    window.open(url, "_blank");
  } catch (err) {
    showUploadErr(err.message);
  }
}

async function doUploadFootage() {
  clearUploadErr();
  const input = document.getElementById("footInput");
  const file = input.files[0];
  if (!file) return;
  const judul = document.getElementById("uploadJudul").value || file.name;
  const folderId = document.getElementById("uploadFolder").value;
  const btn = document.getElementById("uploadBtn");
  btn.textContent = "Mengunggah..."; btn.disabled = true;
  try {
    const fd = new FormData();
    fd.append("file", file);
    fd.append("judul", judul);
    if (folderId) fd.append("folder_id", folderId);
    await apiUpload("/footage", fd);
    input.value = "";
    document.getElementById("uploadJudul").value = "";
    await loadFootage();
  } catch (err) {
    showUploadErr(err.message);
  } finally {
    btn.textContent = "+ Unggah"; btn.disabled = false;
  }
}

async function deleteFootage(id) {
  if (!confirm("Hapus footage ini?")) return;
  try {
    await apiDelete("/footage?id=" + id);
    await loadFootage();
  } catch (err) {
    showUploadErr(err.message);
  }
}

async function apiPost(path, bodyObj) {
  const r = await fetch(API + path, {
    method: "POST",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify(bodyObj),
  });
  if (r.status === 401) { logout(); throw new Error("Sesi habis, silakan login lagi."); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || ("Error " + r.status));
  return d;
}

async function renameFootage(id, oldJudul) {
  const judul = prompt("Nama baru:", oldJudul);
  if (!judul || judul.trim() === "" || judul === oldJudul) return;
  try {
    await apiPost("/footage/rename", { id, judul: judul.trim() });
    await loadFootage();
  } catch (err) {
    showUploadErr(err.message);
  }
}

async function toggleStar(id) {
  try {
    await apiPost("/footage/star", { id });
    await loadFootage();
  } catch (err) {
    showUploadErr(err.message);
  }
}

async function downloadFootage(id, judul) {
  try {
    const r = await fetch(API + "/footage/download?id=" + id, { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) { const d = await r.json(); throw new Error(d.error || "Gagal mengunduh"); }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = judul;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    showUploadErr(err.message);
  }
}

function openMoveDialog(id) {
  moveIsBulk = false;
  moveTargetId = id;
  const sel = document.getElementById("moveFolderSelect");
  sel.innerHTML = `<option value="">(Tanpa folder / root)</option>` +
    allFolders.map(f => `<option value="${f.id}">${escapeHtml(f.nama)}</option>`).join("");
  const current = allFootage.find(x => x.id === id);
  if (current && current.folder_id) sel.value = current.folder_id;
  document.getElementById("moveModal").classList.add("open");
}
function openBulkMoveDialog() {
  if (selectedIds.size === 0) return;
  moveIsBulk = true;
  moveTargetId = null;
  const sel = document.getElementById("moveFolderSelect");
  sel.innerHTML = `<option value="">(Tanpa folder / root)</option>` +
    allFolders.map(f => `<option value="${f.id}">${escapeHtml(f.nama)}</option>`).join("");
  document.getElementById("moveModal").classList.add("open");
}
function closeMoveModal() {
  document.getElementById("moveModal").classList.remove("open");
  moveTargetId = null;
  moveIsBulk = false;
}
async function confirmMove() {
  const folderId = document.getElementById("moveFolderSelect").value;
  try {
    if (moveIsBulk) {
      await apiPost("/footage/move-bulk", { ids: Array.from(selectedIds), folder_id: folderId || null });
      selectedIds.clear();
    } else {
      if (!moveTargetId) return;
      await apiPost("/footage/move", { id: moveTargetId, folder_id: folderId || null });
    }
    closeMoveModal();
    await loadFootage();
    renderBulkBar();
  } catch (err) {
    showUploadErr(err.message);
  }
}

// ===== MODE PILIH & AKSI MASSAL =====
function toggleSelectMode() {
  selectMode = !selectMode;
  selectedIds.clear();
  document.getElementById("selectModeBtn").classList.toggle("active", selectMode);
  renderBulkBar();
  renderFootage();
}
function toggleSelectItem(id, checked) {
  if (checked) selectedIds.add(id); else selectedIds.delete(id);
  renderBulkBar();
}
function toggleSelectFromThumb(id) {
  const chk = document.getElementById("chk-" + id);
  if (!chk) return;
  chk.checked = !chk.checked;
  toggleSelectItem(id, chk.checked);
}
function renderBulkBar() {
  const bar = document.getElementById("bulkBar");
  if (!selectMode || selectedIds.size === 0) { bar.style.display = "none"; return; }
  bar.style.display = "flex";
  document.getElementById("bulkCount").textContent = selectedIds.size + " dipilih";
}
async function bulkDelete() {
  if (selectedIds.size === 0) return;
  if (!confirm(`Hapus ${selectedIds.size} footage terpilih? Tindakan ini tidak bisa dibatalkan.`)) return;
  try {
    await apiPost("/footage/delete-bulk", { ids: Array.from(selectedIds) });
    selectedIds.clear();
    renderBulkBar();
    await loadFootage();
  } catch (err) {
    showUploadErr(err.message);
  }
}
async function bulkDownload() {
  if (selectedIds.size === 0) return;
  const ids = Array.from(selectedIds);
  for (const id of ids) {
    const item = allFootage.find(f => f.id === id);
    await downloadFootage(id, item ? item.judul : ("footage-" + id));
    await new Promise(res => setTimeout(res, 400)); // jeda kecil biar browser tidak memblokir unduhan beruntun
  }
}

async function createFolder() {
  const nama = prompt("Nama folder baru:");
  if (!nama || !nama.trim()) return;
  try {
    await apiPost("/footage/folders", { nama: nama.trim() });
    await loadFolders();
  } catch (err) {
    showUploadErr(err.message);
  }
}

async function deleteFolder(id, nama) {
  if (!confirm(`Hapus folder "${nama}"? Footage di dalamnya akan dipindahkan ke "Tanpa Folder".`)) return;
  try {
    const r = await fetch(API + "/footage/folders?id=" + id, { method: "DELETE", headers: { Authorization: "Bearer " + token } });
    const d = await r.json();
    if (r.status === 401) { logout(); return; }
    if (!r.ok) throw new Error(d.error || ("Error " + r.status));
    if (String(currentFolderId) === String(id)) currentFolderId = "ALL";
    await loadFolders();
    await loadFootage();
  } catch (err) {
    showUploadErr(err.message);
  }
}

async function syncFootage() {
  clearUploadErr();
  const btn = document.getElementById("syncBtn");
  const oldText = btn.textContent;
  btn.textContent = "Menyinkronkan..."; btn.disabled = true;
  try {
    const r = await fetch(API + "/footage/sync", { method: "POST", headers: { Authorization: "Bearer " + token } });
    const d = await r.json();
    if (r.status === 401) { logout(); return; }
    if (!r.ok) throw new Error(d.error || ("Error " + r.status));
    await loadFootage();
    alert(`Sync selesai. ${d.added} file baru ditambahkan dari Drive (total di folder Drive: ${d.total_di_drive}).`);
  } catch (err) {
    showUploadErr(err.message);
  } finally {
    btn.textContent = oldText; btn.disabled = false;
  }
}

function setTab(tipe, btn) {
  document.querySelectorAll(".pillGroup .pillBtn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentTipe = tipe;
  loadFootage();
}

loadFolders();
loadFootage();
</script>
<script src="chat-widget.js"></script>
</body>
